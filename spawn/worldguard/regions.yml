            chest-access: deny
            creeper-explosion: deny
            other-explosion: deny
            tnt: deny
            fire-spread: deny
            lava-fire: deny
            lighter: deny
            ghast-fireball: deny
            enderman-grief: deny
            ravager-grief: deny
            wither-damage: deny
