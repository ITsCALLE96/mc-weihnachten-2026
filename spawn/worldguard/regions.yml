# WorldGuard-Region der Oberwelt, erzeugt mit spawn/standort.mjs aus spawn/standort-weltenbaum-test.json. Einspielen nach
#   plugins/WorldGuard/worlds/world/regions.yml   (laufender Server: rg load -w world)
# spawn: Oval (Mitte -17/-41, Halbachsen 81 in x und 69 in z, 32 Punkte), volle Höhe: Spawnschutz (Nicht-Mitglieder bauen
#   nicht, OPs umgehen das), keine Monster, kein PvP, Truhen zu, Türen/Knöpfe frei. Kein großes Bauverbot.
# Später weiterbauen (Pascal): Nicht-Mitglieder bauen in der Region nicht, deshalb kein build-Flag hier (build deny würde auch Mitglieder sperren).
#   Einzelne Spawn-Bauer:   rg addmember -w world spawn <Name>      (wieder weg: rg removemember -w world spawn <Name>)
#   Für alle freigeben:     rg flag -w world spawn build allow      (und ggf. rg flag -w world spawn chest-access allow)
#   Wieder schützen:        rg flag -w world spawn build             (Flag löschen)
regions:
    spawn:
        type: poly2d
        priority: 10
        min-y: -64
        max-y: 319
        points:
            - {x: 64, z: -41}
            - {x: 62, z: -28}
            - {x: 58, z: -15}
            - {x: 50, z: -3}
            - {x: 40, z: 8}
            - {x: 28, z: 16}
            - {x: 14, z: 23}
            - {x: -1, z: 27}
            - {x: -17, z: 28}
            - {x: -33, z: 27}
            - {x: -48, z: 23}
            - {x: -62, z: 16}
            - {x: -74, z: 8}
            - {x: -84, z: -3}
            - {x: -92, z: -15}
            - {x: -96, z: -28}
            - {x: -98, z: -41}
            - {x: -96, z: -54}
            - {x: -92, z: -67}
            - {x: -84, z: -79}
            - {x: -74, z: -90}
            - {x: -62, z: -98}
            - {x: -48, z: -105}
            - {x: -33, z: -109}
            - {x: -17, z: -110}
            - {x: -1, z: -109}
            - {x: 14, z: -105}
            - {x: 28, z: -98}
            - {x: 40, z: -90}
            - {x: 50, z: -79}
            - {x: 58, z: -67}
            - {x: 62, z: -54}
