            - {x: -118, z: 51}
            - {x: -133, z: 32}
            - {x: -145, z: 11}
            - {x: -152, z: -12}
            - {x: -154, z: -36}
            - {x: -152, z: -60}
            - {x: -145, z: -83}
            - {x: -133, z: -104}
            - {x: -118, z: -123}
            - {x: -99, z: -138}
            - {x: -77, z: -150}
            - {x: -54, z: -157}
            - {x: -30, z: -159}
            - {x: -6, z: -157}
            - {x: 17, z: -150}
            - {x: 39, z: -138}
