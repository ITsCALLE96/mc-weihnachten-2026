name: Serverwahl
version: '1.0.0'
main: de.grahl.serverwahl.Serverwahl
api-version: '26.3'
# LuckPerms für /nick und Clan-Tags, prism für das Prüfwerkzeug (ohne sie bleiben die Teile aus)
softdepend: [LuckPerms, prism]
description: Server-Wahl über Kisten im Hub, /hub zurück (Velocity, Kanal BungeeCord)
commands:
  hub:
    description: Zurück zum Hub (auf dem Hub zum Spawn)
    aliases: [lobby]
    permission: serverwahl.hub
  serverwahl:
    description: "serverwahl reload | menue <kategorie> | oeffnen | schliessen | status | feuerwerk test [sek]|stopp|status | termin liste|test <name> [sek]|zuruecksetzen <name> | rabatt an|aus|auto"
    usage: "/serverwahl reload | menue <kategorie> | oeffnen | schliessen | status | feuerwerk test [sek]|stopp|status | termin liste|test <name> [sek]|zuruecksetzen <name> | rabatt an|aus|auto"
    permission: serverwahl.admin
  nick:
    description: "Eigenen Nickname setzen: /nick <name> | /nick reset (Moderation: /nick info <name>, /nick reset <spieler>)"
    usage: "/nick <name> | /nick reset"
    permission: serverwahl.nick
permissions:
  serverwahl.nick:
    default: true
  serverwahl.nick.andere:
    description: Nick anderer Spieler zurücksetzen
    default: op
  serverwahl.hub:
    default: true
  serverwahl.admin:
    default: op
  serverwahl.vorab:
    description: SMP vor der Eröffnung trotzdem betreten (Tester, Aufbau)
    default: op
