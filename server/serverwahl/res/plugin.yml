name: Serverwahl
version: '1.0.0'
main: de.grahl.serverwahl.Serverwahl
api-version: '26.3'
description: Server-Wahl über Kisten im Hub, /hub zurück (Velocity, Kanal BungeeCord)
commands:
  hub:
    description: Zurück zum Hub (auf dem Hub zum Spawn)
    aliases: [lobby]
    permission: serverwahl.hub
  serverwahl:
    description: "serverwahl reload | menue <kategorie> | oeffnen | schliessen | status"
    usage: "/serverwahl reload | menue <kategorie> | oeffnen | schliessen | status"
    permission: serverwahl.admin
permissions:
  serverwahl.hub:
    default: true
  serverwahl.admin:
    default: op
  serverwahl.vorab:
    description: SMP vor der Eröffnung trotzdem betreten (Tester, Aufbau)
    default: op
