# Serverwahl – Standard ist ein Backend (SMP): nur /hub, keine Kisten.
# Die Hub-Fassung liegt in server/plugin-konfig/hub/plugins/Serverwahl/config.yml
ist-hub: false
# Name des Hubs in velocity.toml [servers]
hub-server: hub
kisten: []
kategorien: {}
# Begehbare Portale (Quader, Innenraum): Betreten schickt per Velocity auf „ziel“ (Standard hub-server), optional sperre: eroeffnung
# - { welt: world, von: "10 150 -3", bis: "10 152 -1", ziel: hub }
portale: []
