# Serverwahl auf dem SMP (MinecraftWeihnachten01): /hub, Ender-Kiste am Spawn mit Menü, Spawn-Elytra.
ist-hub: false
# Name des Hubs in velocity.toml [servers]
hub-server: hub
# Eröffnungssperre: Solange die Datei fehlt, lehnt das SMP jeden Beitritt ab (auch über /server smp).
# Ops und serverwahl.vorab dürfen rein (Tests, Testlauf). Angelegt vom Hub bei der Eröffnung oder per /serverwahl oeffnen.
eroeffnung:
  datei: /opt/mc-weihnachten/status/smp-offen
  beitritt-sperren: true
  text: "<red>Der Weihnachtsserver öffnet am <white>05.12.</white>"
  # einmalig, sobald der Merker auftaucht (Konsole). Erledigt-Merker plugins/Serverwahl/eroeffnet.txt, zurückgesetzt wenn der Merker wieder fehlt
  befehle:
    - "execute if score #phase lf_phase matches 0 run function leitfaden:phase/setzen_1"
    - "time set 0"
    - "weather clear"
# Netherportal nicht anzündbar / keine Enderaugen in Endportalrahmen, solange DimensionControl die Dimension geschlossen führt
portale-sperren: true
text-nether-zu: "<red>Der Nether ist noch geschlossen!"
text-end-zu: "<red>Das End ist noch geschlossen!"
# Einmal-Elytra auf der Spark-Insel (Pascal 27.10.): Doppelsprung = Gleitflug ohne Item, [F] einmal Schub, nach der Landung weg.
# Zone = WorldGuard-Oval der Spawn-Session (Mitte −1/47, Radius 28), erst ab der Standfläche y 150 (Spawn & Welt; gleicher Bereich wie die Sättigung im Datapack insel)
spawn-elytra:
  aktiv: true
  welt: world
  mitte: "-1 47"
  radius: 28
  y-ab: 150
  # Schub mit [F] wie Feuerwerksrakete Stufe 3 (Pascal 27.10.): Ticks, die er wirkt (Stufe 1 ≈ 20, 2 ≈ 30, 3 ≈ 45)
  schub-ticks: 45
  text-start: "<gold>Gleiten! <gray>[F] für einen Schub"
  text-schub: "<gold>Schub!"
  # true schreibt jeden Zustandswechsel ins Server-Log (Fehlersuche)
  debug: false
# Winter-Season (Pascal 27.10., Vorschlag): öfter Niederschlag als Vanilla. Beginnt Regen/Schnee, dauert er dauer-min…dauer-max Minuten,
# danach pause-min…pause-max Minuten klar. Gewitter wie Vanilla. aktiv: false = Vanilla-Wetter (nach der Season). Siehe server/winter.md
wetter-rhythmus:
  aktiv: true
  welt: world
  pause-min: 40
  pause-max: 60
  dauer-min: 5
  dauer-max: 8
# Winterkalender der Spawn-Insel (Datapack insel, Spawn & Welt 27.10.): serverwahl setzt jede Minute #tag in insel_kalender auf den Dezembertag
# (vor Dezember 0, 1.–24.12. = Tag, danach bis Jahresende 24). Aus dem Datum, übersteht Neustarts; kein AMP-Zeitplan nötig.
# fester-tag > 0 überschreibt das Datum (Testnetz). Zum Testen mit function insel:kalender/tag {tag:5} vorher aktiv: false oder fester-tag setzen
kalender:
  aktiv: true
  objective: insel_kalender
  eintrag: "#tag"
  zeitzone: Europe/Berlin
  fester-tag: 0
# Begehbare Portale (Quader → Velocity auf „ziel“), Beispiel:  - { welt: world, von: "10 150 -3", bis: "10 152 -1", ziel: hub }
# Spark-Insel: Portal nach Pascals Test 27.10. wieder raus, stattdessen die Ender-Kiste unten
portale: []
text-portal: "<gold>Ab zum Hub …"
# Ender-Kiste am Spawn der Spark-Insel öffnet das Menü (Pascal 27.10.): Podestmitte −1/156/47, neben dem Weltspawn 0/156/48 (Spawn & Welt)
kisten:
  - {welt: world, x: -1, y: 156, z: 47, kategorie: spawn}
kategorien:
  spawn:
    # nur der Hub (Pascal 27.10.: der eigene Server gehört nicht ins Menü)
    titel: "<dark_purple>Serverwahl"
    server:
      - name: hub
        anzeige: "<aqua>Hub"
        material: ENDER_PEARL
        beschreibung:
          - "<gray>Zurück zur Lobby"
          - ""
          - "<yellow>Klicken zum Wechseln"
# Xaero: eigene Welt-ID, damit Minimap/Weltkarte Hub und SMP getrennt speichern (hinter Velocity sonst dieselbe „Welt“). Fest lassen, sonst neue leere Karte
xaero-welt-id: 26120501
