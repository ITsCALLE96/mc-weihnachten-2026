# Serverwahl auf dem SMP (MinecraftWeihnachten01): /hub, Ender-Kiste am Spawn mit Menü, Spawn-Elytra.
ist-hub: false
# Name des Hubs in velocity.toml [servers]
hub-server: hub
# Eröffnungssperre: Solange die Datei fehlt, lehnt das SMP jeden Beitritt ab (auch über /server smp).
# Ops und serverwahl.vorab dürfen rein (Tests, Testlauf). Angelegt vom Hub bei der Eröffnung oder per /serverwahl oeffnen.
eroeffnung:
  datei: /opt/mc-weihnachten/status/smp-offen
  beitritt-sperren: true
  text: "<red>Der Weihnachtsserver öffnet am <white>27.11.</white>"
  # einmalig, sobald der Merker auftaucht (Konsole). Erledigt-Merker plugins/Serverwahl/eroeffnet.txt, zurückgesetzt wenn der Merker wieder fehlt
  befehle:
    - "execute if score #phase lf_phase matches 0 run function leitfaden:phase/setzen_1"
    - "time set 0"
    - "weather clear"
# Netherportal nicht anzündbar / keine Enderaugen in Endportalrahmen, solange DimensionControl die Dimension geschlossen führt
portale-sperren: true
text-nether-zu: "<red>Der Nether ist noch geschlossen!"
text-end-zu: "<red>Das End ist noch geschlossen!"
# Einmal-Elytra auf der Spark-Insel (Pascal 27.10./28.10.): von der Insel springen = automatisch Gleitflug ohne Item, [F] einmal Schub, nach der Landung weg.
# Zone = WorldGuard-Oval der Spawn-Session (Mitte −1/47, Radius 28), erst ab der Standfläche y 150 (Spawn & Welt; gleicher Bereich wie die Sättigung im Datapack insel)
spawn-elytra:
  aktiv: true
  welt: world
  mitte: "-1 47"
  radius: 28
  y-ab: 150
  # Schub mit [F] wie Feuerwerksrakete Stufe 3 (Pascal 27.10.): Ticks, die er wirkt (Stufe 1 ≈ 20, 2 ≈ 30, 3 ≈ 45)
  schub-ticks: 45
  # Gleitflug startet ab dieser Fallhöhe (Blöcke), wenn darunter boden-frei Blöcke Luft sind (kleine Stufen auf der Insel lösen nicht aus)
  fall-ab: 2.5
  boden-frei: 4
  text-start: "<gold>Gleiten! <gray>[F] für einen Schub"
  text-schub: "<gold>Schub!"
  # true schreibt jeden Zustandswechsel ins Server-Log (Fehlersuche)
  debug: false
# Winter-Season (Pascal 27.10., Vorschlag): öfter Niederschlag als Vanilla. Beginnt Regen/Schnee, dauert er dauer-min…dauer-max Minuten,
# danach pause-min…pause-max Minuten klar. Gewitter wie Vanilla. aktiv: false = Vanilla-Wetter (nach der Season). Siehe server/winter.md
wetter-rhythmus:
  aktiv: true
  welt: world
  pause-min: 40
  pause-max: 60
  dauer-min: 5
  dauer-max: 8
# Winterkalender der Spawn-Insel (Datapack insel, Spawn & Welt 27.10.): serverwahl setzt jede Minute #tag in insel_kalender auf den Dezembertag
# (vor Dezember 0, 1.–24.12. = Tag, danach bis Jahresende 24). Aus dem Datum, übersteht Neustarts; kein AMP-Zeitplan nötig.
# fester-tag > 0 überschreibt das Datum (Testnetz). Zum Testen mit function insel:kalender/tag {tag:5} vorher aktiv: false oder fester-tag setzen
kalender:
  aktiv: true
  objective: insel_kalender
  eintrag: "#tag"
  zeitzone: Europe/Berlin
  fester-tag: 0
  # Rechtsklick auf ein Türchen (Interaction mit Tag klick.tag) führt serverwahl selbst aus, sonst sperrt WorldGuard ihn in der Spawn-Region.
  # {n} = Zahl aus dem Tag <nummer-praefix><n>, z. B. insel_kal_7 → insel:kalender/tuer_7 (als der Spieler, wie „on target“ im Datapack)
  klick:
    tag: insel_kal_klick
    nummer-praefix: insel_kal_
    funktion: "insel:kalender/tuer_{n}"
# Begehbare Portale (Quader → Velocity auf „ziel“), Beispiel:  - { welt: world, von: "10 150 -3", bis: "10 152 -1", ziel: hub }
# Spark-Insel: Portal nach Pascals Test 27.10. wieder raus, stattdessen die Ender-Kiste unten
portale: []
text-portal: "<gold>Ab zum Hub …"
# Ender-Kiste am Spawn der Spark-Insel öffnet das Menü (Pascal 27.10.): Podestmitte −1/156/47, neben dem Weltspawn 0/156/48 (Spawn & Welt)
kisten:
  - {welt: world, x: -1, y: 156, z: 47, kategorie: spawn}
kategorien:
  spawn:
    # nur der Hub (Pascal 27.10.: der eigene Server gehört nicht ins Menü)
    titel: "<dark_purple>Serverwahl"
    server:
      - name: hub
        anzeige: "<aqua>Hub"
        material: ENDER_PEARL
        beschreibung:
          - "<gray>Zurück zur Lobby"
          - ""
          - "<yellow>Klicken zum Wechseln"
# Xaero: eigene Welt-ID, damit Minimap/Weltkarte Hub und SMP getrennt speichern (hinter Velocity sonst dieselbe „Welt“). Fest lassen, sonst neue leere Karte
xaero-welt-id: 26120501
# Nicknames und Clan-Tags (Pascal 28.10., Plan server/namen-clans-grief.md): /nick <name> | /nick reset, gespeichert in LuckPerms (gemeinsam mit dem
# anderen Server). Clan-Tag = LuckPerms-Präfix der Gruppe clan-<name>, nur Pascal vergibt ihn. Ohne LuckPerms bleibt der Teil aus.
namen:
  aktiv: true
  nick-min: 3
  nick-max: 16
  abklingzeit-sekunden: 10
  # Grundform (klein, 0→o, 1/l→i, 3→e, 4→a, 5→s, 7→t, ohne _/-) darf keins dieser Wörter sein (ab 5 Buchstaben auch nicht enthalten)
  sperrliste: [admin, moderator, mod, server, konsole, console, owner, staff, team, support, herobrine]
# Täglich ab uhrzeit (Fenster 1 h) Konsolenbefehle, Merker plugins/Serverwahl/taeglich.txt. Zurzeit keine: den Purge macht Prism selbst
# (prism.conf command-schedules, 05:00, 90 Tage)
taeglich:
  uhrzeit: "05:00"
  zeitzone: Europe/Berlin
  befehle: []
# Prüfwerkzeug (Pascal 28.10.): Holzspitzhacke in der Hand = Prism-Abfrage per Klick für alle mit prism.lookup, ohne /pr wand.
# Links = Block, Rechts = Kiste/Platziertes; Schleichen = normal abbauen. Siehe server/namen-clans-grief.md
pruefwerkzeug:
  aktiv: true
  werkzeug: WOODEN_PICKAXE
  # Einträge je Klick (neueste zuerst)
  zeilen: 8
# Winter-Season (Pascal 28.10.): Ozeane und Fluss sind im Datapack jetzt auch kalt (Schnee statt Regen), Wasser dort friert aber nicht zu.
# Nur natürliche Eisbildung; Frostläufer, gesetztes Eis und die von Natur aus gefrorenen Biome bleiben. Nach der Season mit dem Datapack aus
eis-sperre:
  aktiv: true
  # beach/stony_shore: Wasser an der Küste gehört dort zum Strand-Biom (Stichprobe 28.10.: Eis nur in beach, plains, forest)
  biome: [ocean, deep_ocean, cold_ocean, deep_cold_ocean, lukewarm_ocean, deep_lukewarm_ocean, warm_ocean, river, beach, stony_shore]
# Spielregeln der Overworld, bei jedem Start und /serverwahl reload gesetzt (Pascal 28.10.: Schnee höchstens ein halber Block = 4 Lagen).
# Nach der Season: max_snow_accumulation_height wieder 1 (Vanilla)
spielregeln:
  max_snow_accumulation_height: 4
# Neujahrsfeuerwerk (Pascal 28.10.): echte Uhr, für alle online Spieler, wo sie gerade sind. Vorher Nacht + klares Wetter, Countdown als Titel.
# Gegen Lag teilen sich Spieler in gruppen-radius die Raketen; je runde-ticks je Gruppe raketen-je-runde Raketen (Standard ≈ 1,3/s je Gruppe).
# Raketen ohne Schaden, nicht im Nether. Test: /serverwahl feuerwerk test [sekunden] | stopp | status
neujahr:
  aktiv: true
  zeitpunkt: "2027-01-01T00:00"
  zeitzone: Europe/Berlin
  nacht-vorher-sekunden: 120
  countdown-sekunden: 10
  dauer-sekunden: 120
  runde-ticks: 30
  raketen-je-runde: 2
  gruppen-radius: 32
  abstand-min: 8
  abstand-max: 22
  titel: "<gold><bold>Frohes neues Jahr 2027!"
  untertitel: ""
  # Nacht als Zeitraffer statt Sprung (Dorfbewohner durchlaufen ihren Tagesplan normal), beim Test 3 s
  nacht-uebergang-sekunden: 40
  # Schriftzug am Himmel je Spieler (nur für ihn sichtbar), Deutsch bei deutscher Client-Sprache, sonst Englisch; leer = aus
  himmel-text-de: "<bold><gradient:#FFD700:#FF8C00:#FF3B3B>Frohes neues Jahr 2027!"
  himmel-text-en: "<bold><gradient:#FFD700:#FF8C00:#FF3B3B>Happy New Year 2027!"
  himmel-skala: 7
  himmel-abstand: 45
  himmel-hoehe: 22
# Termine nach echter Uhr (Pascal 28.10.): ersetzen die AMP-Aufgaben für die Phasen. Ankündigung im Chat (Minuten vorher), Countdown als Titel,
# dann die Befehle. Jeder Termin läuft einmal (Merker plugins/Serverwahl/termine.txt), verpasste werden beim nächsten Start nachgeholt.
# Uhrzeiten vorläufig 18:00 (Pascal legt sie noch fest). /serverwahl termin liste | test <name> [sek] | zuruecksetzen <name>
termine:
  zeitzone: Europe/Berlin
  liste:
    - name: nether
      zeitpunkt: "2026-12-11T18:00"
      ankuendigen: [1440, 60, 30, 10, 5, 1]
      countdown: 10
      text: "<red>Der Nether öffnet!"
      befehle: ["nether open", "function leitfaden:phase/setzen_2"]
    # Phase 3 (Questbuch: nur eine Meldung) – Termin zwischen Nether und End ist ein Vorschlag, Leitung entscheidet
    - name: phase3
      zeitpunkt: "2026-12-15T18:00"
      ankuendigen: []
      countdown: 0
      text: "Phase 3"
      befehle: ["function leitfaden:phase/setzen_3"]
    - name: end
      zeitpunkt: "2026-12-18T18:00"
      ankuendigen: [1440, 60, 30, 10, 5, 1]
      countdown: 10
      text: "<light_purple>Das End öffnet – gemeinsamer Drachenkampf!"
      befehle: ["end open", "function leitfaden:phase/setzen_4"]
# Weihnachtsrabatt bei Dorfbewohnern (Pascal 28.10.): an diesen Tagen alles zum halben Preis, zusätzlich zu den Vanilla-Rabatten.
# Gilt beim Öffnen des Handelsfensters, nichts bleibt dauerhaft gespeichert. Test: /serverwahl rabatt an | aus | auto | status
dorf-rabatt:
  aktiv: true
  zeitzone: Europe/Berlin
  prozent: 50
  tage: ["2026-12-24", "2026-12-25", "2026-12-26"]
# Discord-Whitelist (Pascal 28.10.): liest dieselbe Datei wie der Hub (der Hub schreibt sie), kein eigener Endpunkt
discord-whitelist:
  aktiv: true
  datei: /opt/mc-weihnachten/whitelist/discord.json
  floodgate-praefix: "."
  kick-text: "Du stehst nicht mehr auf der Whitelist (Discord-Anmeldung bzw. Rolle fehlt)."
