# Serverwahl auf dem SMP (MinecraftWeihnachten01): /hub, Ender-Kiste am Spawn mit Menü, Spawn-Elytra.
ist-hub: false
# Name des Hubs in velocity.toml [servers]
hub-server: hub
# Eröffnungssperre: Solange die Datei fehlt, lehnt das SMP jeden Beitritt ab (auch über /server smp).
# Ops und serverwahl.vorab dürfen rein (Tests, Testlauf). Angelegt vom Hub bei der Eröffnung oder per /serverwahl oeffnen.
eroeffnung:
  datei: /opt/mc-weihnachten/status/smp-offen
  beitritt-sperren: true
  text: "<red>Der Weihnachtsserver öffnet am <white>05.12.</white>"
  # einmalig, sobald der Merker auftaucht (Konsole). Erledigt-Merker plugins/Serverwahl/eroeffnet.txt, zurückgesetzt wenn der Merker wieder fehlt
  befehle:
    - "execute if score #phase lf_phase matches 0 run function leitfaden:phase/setzen_1"
    - "time set 0"
    - "weather clear"
# Netherportal nicht anzündbar / keine Enderaugen in Endportalrahmen, solange DimensionControl die Dimension geschlossen führt
portale-sperren: true
text-nether-zu: "<red>Der Nether ist noch geschlossen!"
text-end-zu: "<red>Das End ist noch geschlossen!"
# Einmal-Elytra auf der Spark-Insel (Pascal 27.10.): Doppelsprung = Gleitflug ohne Item, [F] einmal Schub, nach der Landung weg.
# Zone = WorldGuard-Oval der Spawn-Session (Mitte −1/47, Radius 28, ab y 89)
spawn-elytra:
  aktiv: true
  welt: world
  mitte: "-1 47"
  radius: 28
  y-ab: 89
  schub: 1.5
  text-start: "<gold>Gleiten! <gray>[F] für einen Schub"
  text-schub: "<gold>Schub!"
# Begehbare Portale (Quader → Velocity auf „ziel“), Beispiel:  - { welt: world, von: "10 150 -3", bis: "10 152 -1", ziel: hub }
# Spark-Insel: Portal nach Pascals Test 27.10. wieder raus, stattdessen die Ender-Kiste unten
portale: []
text-portal: "<gold>Ab zum Hub …"
# Ender-Kiste am Spawn der Spark-Insel öffnet das Menü (Pascal 27.10.). Position von der Spawn-Session, NOCH OFFEN
kisten: []
#  - {welt: world, x: 0, y: 156, z: 46, kategorie: spawn}
kategorien:
  spawn:
    titel: "<dark_purple>Serverwahl"
    server:
      - name: hub
        anzeige: "<aqua>Hub"
        material: ENDER_PEARL
        beschreibung:
          - "<gray>Zurück zur Lobby"
          - ""
          - "<yellow>Klicken zum Wechseln"
      - name: smp
        anzeige: "<gradient:#ff5252:#ffffff:#4cd964>Weihnachtsserver 2026</gradient>"
        material: SPRUCE_SAPLING
        hier: true
        beschreibung:
          - "<gray>SMP · Survival"
          - ""
          - "<green>Du bist hier"
