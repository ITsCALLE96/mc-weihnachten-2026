# Hub (MinecraftHub01): Schutz für die ganze Welt über die globale Region.
# Abenteuermodus verhindert Abbauen und Bauen schon; das hier sperrt den Rest (Kisten plündern, Rahmen drehen, PvP, Mobs).
# Die Crate-Kisten öffnen trotzdem das Menü (serverwahl reagiert auch auf von WorldGuard gesperrte Klicks).
# Ops mit /rg bypass sind ausgenommen.
# Kein mob-spawning deny: Das hätte beim Einfügen der Hub-Struktur die Dorfbewohner und Fische verhindert (Spawn & Welt, Test 24.10.).
# Natürliches Spawnen verhindern schon difficulty=peaceful und gamerule spawn_mobs false.
regions:
  __global__:
    type: global
    priority: 0
    flags:
      pvp: deny
      chest-access: deny
      item-frame-rotation: deny
      entity-item-frame-destroy: deny
      entity-painting-destroy: deny
      damage-animals: deny
      invincible: allow
      item-drop: deny
      vehicle-destroy: deny
      fire-spread: deny
      lava-fire: deny
      ice-melt: deny
      snow-melt: deny
      leaf-decay: deny
      crop-growth: deny
      # keine „Hey! Sorry, but you can't …“-Meldungen im Hub (Leitung 27.10.); serverwahl fängt Kisten-Klicks ohnehin vorher ab
      deny-message: ''
    members: {}
    owners: {}
