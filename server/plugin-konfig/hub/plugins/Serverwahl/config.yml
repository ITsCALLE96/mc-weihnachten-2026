# Serverwahl auf dem Hub (MinecraftHub01). Nach Änderung: /serverwahl reload
ist-hub: true
hub-server: hub
# Eröffnung 05.12.: Das Hub-Datapack (Spawn & Welt) setzt #offen in insel_zustand auf 1, dann legt der Hub die Datei an.
# Dieselbe Datei prüft das SMP beim Beitritt. Liegt außerhalb beider Instanzen, Ordner gehört amp (Task 2 Schritt 6b).
eroeffnung:
  datei: /opt/mc-weihnachten/status/smp-offen
  ausloeser: {objective: insel_zustand, eintrag: "#offen", ab: 1}
  text: "<red>Der Weihnachtsserver öffnet am <white>05.12.</white>"
# Crate-Kisten im Fantasy Village: Rechtsklick öffnet das Menü der Kategorie.
# Koordinaten vom Testserver (Leitung 24.10.), nach dem Hub-Aufbau der Spawn-&-Welt-Session prüfen.
kisten:
  - {welt: world, x: 25, y: 236, z: -9, kategorie: smp}
  - {welt: world, x: 27, y: 236, z: -5, kategorie: testwelt}
  - {welt: world, x: 28, y: 236, z: 0, kategorie: alle}
  - {welt: world, x: 27, y: 236, z: 5, kategorie: minigames}
  - {welt: world, x: 25, y: 236, z: 9, kategorie: bald}
# name = Servername in velocity.toml [servers]; Text in MiniMessage
# sperre: eroeffnung → bis zur Eröffnung Barriere mit dem Text aus eroeffnung.text (Ops und serverwahl.vorab kommen durch)
kategorien:
  smp:
    titel: "<dark_green>SMP-Server"
    server:
      - name: smp
        anzeige: "<gradient:#ff5252:#ffffff:#4cd964>Weihnachtsserver 2026</gradient>"
        material: SPRUCE_SAPLING
        sperre: eroeffnung
        beschreibung:
          - "<gray>Survival mit dem Weihnachts-Modpack"
          - "<gray>Start am <white>05.12.</white>"
          - ""
          - "<yellow>Klicken zum Beitreten"
  alle:
    titel: "<dark_purple>Alle Server"
    server:
      - name: smp
        anzeige: "<gradient:#ff5252:#ffffff:#4cd964>Weihnachtsserver 2026</gradient>"
        material: SPRUCE_SAPLING
        sperre: eroeffnung
        beschreibung:
          - "<gray>SMP · Survival"
          - ""
          - "<yellow>Klicken zum Beitreten"
  testwelt:
    titel: "<aqua>Testwelt"
    server: []
  minigames:
    titel: "<gold>Minigames"
    server: []
  bald:
    titel: "<gray>Bald"
    server: []
# Xaero: eigene Welt-ID, damit Minimap/Weltkarte Hub und SMP getrennt speichern (hinter Velocity sonst dieselbe „Welt“). Fest lassen, sonst neue leere Karte
xaero-welt-id: 26120101
# Nicknames und Clan-Tags (Pascal 28.10., Plan server/namen-clans-grief.md): /nick <name> | /nick reset, gespeichert in LuckPerms (gemeinsam mit dem
# anderen Server). Clan-Tag = LuckPerms-Präfix der Gruppe clan-<name>, nur Pascal vergibt ihn. Ohne LuckPerms bleibt der Teil aus.
namen:
  aktiv: true
  nick-min: 3
  nick-max: 16
  abklingzeit-sekunden: 10
  # Grundform (klein, 0→o, 1/l→i, 3→e, 4→a, 5→s, 7→t, ohne _/-) darf keins dieser Wörter sein (ab 5 Buchstaben auch nicht enthalten)
  sperrliste: [admin, moderator, mod, server, konsole, console, owner, staff, team, support, herobrine]
# Neujahrsfeuerwerk (Pascal 28.10.): echte Uhr, für alle online Spieler, wo sie gerade sind. Vorher Nacht + klares Wetter, Countdown als Titel.
# Gegen Lag teilen sich Spieler in gruppen-radius die Raketen; je runde-ticks je Gruppe raketen-je-runde Raketen (Standard ≈ 1,3/s je Gruppe).
# Raketen ohne Schaden, nicht im Nether. Test: /serverwahl feuerwerk test [sekunden] | stopp | status
neujahr:
  aktiv: true
  zeitpunkt: "2027-01-01T00:00"
  zeitzone: Europe/Berlin
  nacht-vorher-sekunden: 120
  countdown-sekunden: 10
  dauer-sekunden: 120
  runde-ticks: 30
  raketen-je-runde: 2
  gruppen-radius: 32
  abstand-min: 8
  abstand-max: 22
  titel: "<gold><bold>Frohes neues Jahr 2027!"
  untertitel: ""
  # Nacht als Zeitraffer statt Sprung (Dorfbewohner durchlaufen ihren Tagesplan normal), beim Test 3 s
  nacht-uebergang-sekunden: 40
  # Schriftzug am Himmel je Spieler (nur für ihn sichtbar), Deutsch bei deutscher Client-Sprache, sonst Englisch; leer = aus
  himmel-text-de: "<bold><gradient:#FFD700:#FF8C00:#FF3B3B>Frohes neues Jahr 2027!"
  himmel-text-en: "<bold><gradient:#FFD700:#FF8C00:#FF3B3B>Happy New Year 2027!"
  himmel-skala: 7
  himmel-abstand: 45
  himmel-hoehe: 22
