# Serverwahl auf dem Hub (MinecraftHub01). Nach Änderung: /serverwahl reload
ist-hub: true
hub-server: hub
# Eröffnung 27.11.: Das Hub-Datapack (Spawn & Welt) setzt #offen in insel_zustand auf 1, dann legt der Hub die Datei an.
# Dieselbe Datei prüft das SMP beim Beitritt. Liegt außerhalb beider Instanzen, Ordner gehört amp (Task 2 Schritt 6b).
eroeffnung:
  datei: /AMP/geteilt/status/smp-offen
  ausloeser: {objective: insel_zustand, eintrag: "#offen", ab: 1}
  # Generalprobe: neutral; zum 27.11. wieder "<red>Der Server öffnet am <white>27.11.</white>"
  text: "<red>Der Server ist noch nicht geöffnet"
# Crate-Kisten im Fantasy Village: Rechtsklick öffnet das Menü der Kategorie.
# Koordinaten vom Testserver (Leitung 24.10.), nach dem Hub-Aufbau der Spawn-&-Welt-Session prüfen.
kisten:
  - {welt: world, x: 25, y: 236, z: -9, kategorie: smp}
  - {welt: world, x: 27, y: 236, z: -5, kategorie: testwelt}
  - {welt: world, x: 28, y: 236, z: 0, kategorie: alle}
  - {welt: world, x: 27, y: 236, z: 5, kategorie: minigames}
  - {welt: world, x: 25, y: 236, z: 9, kategorie: bald}
# name = Servername in velocity.toml [servers]; Text in MiniMessage
# sperre: eroeffnung → bis zur Eröffnung Barriere mit dem Text aus eroeffnung.text (Ops und serverwahl.vorab kommen durch)
kategorien:
  smp:
    titel: "<dark_green>SMP-Server"
    server:
      - name: smp
        anzeige: "<gradient:#4cd964:#ffffff:#5ac8fa>SMP</gradient>"
        material: SPRUCE_SAPLING
        sperre: eroeffnung
        beschreibung:
          - "<gray>Survival mit dem Weihnachts-Modpack"
          # Generalprobe; zum 27.11. wieder "<gray>Start am <white>27.11.</white>"
          - "<gray>Generalprobe im November"
          - ""
          - "<yellow>Klicken zum Beitreten"
  alle:
    titel: "<dark_purple>Alle Server"
    server:
      - name: smp
        anzeige: "<gradient:#4cd964:#ffffff:#5ac8fa>SMP</gradient>"
        material: SPRUCE_SAPLING
        sperre: eroeffnung
        beschreibung:
          - "<gray>SMP · Survival"
          - ""
          - "<yellow>Klicken zum Beitreten"
  testwelt:
    titel: "<aqua>Testwelt"
    # Admin-Testwelt mit Mob-Zoo (Pascal 28.10.): nur mit serverwahl.testwelt sichtbar (Standard aus, im Testnetz für admin), alle anderen sehen „Bald“.
    # Gibt es im Netz keinen Server „testwelt“ (VM200 vorerst nicht), das Recht einfach nicht vergeben
    server:
      - name: testwelt
        anzeige: "<aqua>Testwelt"
        material: SPAWNER
        recht: serverwahl.testwelt
        beschreibung:
          - "<gray>Mob-Zoo und Proben (nur Admins)"
          - ""
          - "<yellow>Klicken zum Beitreten"
  minigames:
    titel: "<gold>Minigames"
    server: []
  bald:
    titel: "<gray>Bald"
    server: []
# Xaero: eigene Welt-ID, damit Minimap/Weltkarte Hub und SMP getrennt speichern (hinter Velocity sonst dieselbe „Welt“). Fest lassen, sonst neue leere Karte
xaero-welt-id: 26120101
# Nicknames und Clan-Tags (Pascal 28.10., Plan server/namen-clans-grief.md): /nick <name> | /nick reset, gespeichert in LuckPerms (gemeinsam mit dem
# anderen Server). Clan-Tag = LuckPerms-Präfix der Gruppe clan-<name>, nur Pascal vergibt ihn. Ohne LuckPerms bleibt der Teil aus.
namen:
  aktiv: true
  nick-min: 3
  nick-max: 16
  abklingzeit-sekunden: 10
  # Grundform (klein, 0→o, 1/l→i, 3→e, 4→a, 5→s, 7→t, ohne _/-) darf keins dieser Wörter sein (ab 5 Buchstaben auch nicht enthalten)
  sperrliste: [admin, moderator, mod, server, konsole, console, owner, staff, team, support, herobrine]
# Neujahrsfeuerwerk (Pascal 28.10.): echte Uhr, für alle online Spieler, wo sie gerade sind. Vorher Nacht + klares Wetter, Countdown als Titel.
# Gegen Lag teilen sich Spieler in gruppen-radius die Raketen; je runde-ticks je Gruppe raketen-je-runde Raketen (Standard ≈ 1,3/s je Gruppe).
# Raketen ohne Schaden, nicht im Nether. Test: /serverwahl feuerwerk test [sekunden] | stopp | status
neujahr:
  aktiv: true
  zeitpunkt: "2027-01-01T00:00"
  zeitzone: Europe/Berlin
  nacht-vorher-sekunden: 120
  countdown-sekunden: 10
  dauer-sekunden: 120
  runde-ticks: 30
  raketen-je-runde: 2
  gruppen-radius: 32
  abstand-min: 8
  abstand-max: 22
  titel: "<gold><bold>Frohes neues Jahr 2027!"
  untertitel: ""
  # Nacht als Zeitraffer statt Sprung (Dorfbewohner durchlaufen ihren Tagesplan normal), beim Test 3 s
  nacht-uebergang-sekunden: 40
  # Schriftzug am Himmel je Spieler (nur für ihn sichtbar), Deutsch bei deutscher Client-Sprache, sonst Englisch; leer = aus
  himmel-text-de: "<bold><gradient:#FFD700:#FF8C00:#FF3B3B>Frohes neues Jahr 2027!"
  himmel-text-en: "<bold><gradient:#FFD700:#FF8C00:#FF3B3B>Happy New Year 2027!"
  himmel-skala: 7
  himmel-abstand: 45
  himmel-hoehe: 22
# Termine nach echter Uhr (Pascal 28.10.): Start Fr 27.11. Pascal öffnet von Hand (function hub:eroeffnung); 18:00 nur Ankündigungen,
# 18:10 Rückfall, falls er ausfällt (wirkt nur, solange noch zu). Uhrzeit vorläufig 18:00. /serverwahl termin liste | test <name> [sek]
termine:
  zeitzone: Europe/Berlin
  # GENERALPROBE NOVEMBER (Pascal 30.10.): liste-november gilt (SMP ist für Tester schon offen, daher ohne Start-Termine).
  # Vor dem 27.11. auf "liste" (Dezember) zurückstellen. Eigene Namen, damit termine.txt die Dezember-Termine nicht als erledigt führt
  aktive-liste: liste-november
  liste-november:
    - name: nether-probe
      zeitpunkt: "2026-11-06T18:00"
      ankuendigen: [60, 10, 1]
      countdown: 10
      text: "<red>Der Nether öffnet auf dem SMP!"
      befehle: []
      event: nether
    - name: end-probe
      zeitpunkt: "2026-11-13T18:00"
      ankuendigen: [60, 10, 1]
      countdown: 10
      text: "<light_purple>Das End öffnet auf dem SMP – Drachenkampf!"
      befehle: []
      event: end
  # Dezember (echter Start)
  liste:
    - name: start-ankuendigung
      zeitpunkt: "2026-11-27T18:00"
      ankuendigen: [1440, 60, 30, 10, 5, 1]
      countdown: 0
      text: "<gold>Der Server öffnet!"
      befehle: []
    - name: start-rueckfall
      zeitpunkt: "2026-11-27T18:10"
      ankuendigen: []
      countdown: 0
      text: "Eröffnung"
      befehle: ["execute if score #offen insel_zustand matches 0 run function hub:eroeffnung"]
    # Nether/End: im Hub nur Countdown und dezente Stimmung (geöffnet wird auf dem SMP), gleiche Zeitpunkte wie dort
    - name: nether
      zeitpunkt: "2026-12-11T18:00"
      ankuendigen: [60, 10, 1]
      countdown: 10
      text: "<red>Der Nether öffnet auf dem SMP!"
      befehle: []
      event: nether
    - name: end
      zeitpunkt: "2026-12-18T18:00"
      ankuendigen: [60, 10, 1]
      countdown: 10
      text: "<light_purple>Das End öffnet auf dem SMP – Drachenkampf!"
      befehle: []
      event: end
# Event beim Öffnen von Nether/End (Pascal 28.10.): vorlauf s vor bis nachlauf s nach dem Termin, nur Spieler in der Oberwelt, nur Anzeige
# (Spieler-eigene Nacht/Regen/roter Rand, Blitz-Effekte ohne Schaden/Feuer, Partikel, Klänge, Bossbar). Kein Schaden, kein Feuer, keine Blöcke.
# Am Termin: event: nether|end. Test: /serverwahl termin test nether|end [sek] · Stand/Abbruch: /serverwahl termin event [stopp]
termin-event:
  vorlauf: 75
  nachlauf: 12
  dezent: true
  blitze: true
  rand: true
  nacht: true
  titel-nether: "<red><bold>Der Nether ist offen!"
  titel-end: "<light_purple><bold>Das End ist offen – Drachenkampf!"
  bossbar-nether: "<red>Der Nether öffnet …"
  bossbar-end: "<light_purple>Das End öffnet …"
# Discord-Whitelist (Pascal 28.10., Spezifikation server/discord-whitelist.md): Einträge aus der gemeinsamen Datei dürfen trotz Vanilla-Whitelist herein,
# Pascal und Tester bleiben von Hand auf der Vanilla-Whitelist. Nur der Hub hat den Endpunkt für den Community-Bot (nur LAN, IP-Sperre + Schlüssel
# plugins/Serverwahl/whitelist-api.key, wird beim ersten Start erzeugt, nie ins Repo). /serverwahl whitelist zeigt den Stand
discord-whitelist:
  aktiv: true
  datei: /AMP/geteilt/whitelist/discord.json
  floodgate-praefix: "."
  kick-text: "Du stehst nicht mehr auf der Whitelist (Discord-Anmeldung bzw. Rolle fehlt)."
  api:
    aktiv: true
    adresse: 192.168.178.78
    port: 8765
    # LXC 202 (Community-Bot, feste FRITZ!Box-Reservierung); zusätzlich nft/ufw-Regel auf VM200
    erlaubt: [192.168.178.22]
    schluessel-datei: whitelist-api.key
    # Erlaubte Discord-Server (Guild-IDs, in Anführungszeichen); andere werden mit 403 abgelehnt. Beim Einrichten eintragen (Leitung/Bot-Session):
    # Server der Jungs, Community-Server … Leer = alle Anmeldungen abgelehnt
    gilden: []
